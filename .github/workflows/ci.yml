name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_PORT: "4100"
  STACK_DIR: /opt/agentic-cicd

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: next build
        run: npm run build
        env:
          POSTGRES_URL: postgres://build:build@127.0.0.1:5432/build
          AUTH_SECRET: build-time-placeholder
          BASE_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder

  agentic-e2e:
    name: Agentic E2E (LLM drives the UI)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Build image for the ephemeral stack
        run: docker build -t agentic-cicd:ci .
      - name: Start app + Postgres
        run: |
          set -euo pipefail
          IMAGE=agentic-cicd:ci APP_PORT=4100 DB_PORT=55433 AUTH_SECRET=ci-\${{ github.run_id }} \
            docker compose -p ci -f docker-compose.staging.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose -p ci -f docker-compose.staging.yml logs --tail=60
          exit 1
      - name: Run the agent journey
        env:
          APP_URL: http://127.0.0.1:4100
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat
          LLM_API_KEY: \${{ secrets.DEEPSEEK_API_KEY }}
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:55433/demo
          AGENT_EMAIL: agent+\${{ github.run_id }}@example.com
          AGENT_INVITEE: teammate+\${{ github.run_id }}@example.com
        run: node scripts/agent-journey.mjs 2>&1 | tee agent-run.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence
          path: |
            agent-run.log
            agent-final.png
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose -p ci -f docker-compose.staging.yml down -v

  docker:
    name: Build & push image
    needs: [build, agentic-e2e]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to vps-b
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        env:
          VPS_B_HOST: ${{ secrets.VPS_B_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_B_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_B_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose file
        env:
          VPS_B_HOST: ${{ secrets.VPS_B_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy root@"$VPS_B_HOST" "mkdir -p $STACK_DIR"
          scp -i ~/.ssh/id_deploy docker-compose.staging.yml root@"$VPS_B_HOST":$STACK_DIR/docker-compose.yml

      - name: Pull & up
        env:
          VPS_B_HOST: ${{ secrets.VPS_B_HOST }}
          TAG: ${{ needs.docker.outputs.tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy root@"$VPS_B_HOST" bash -s <<EOF
          set -euo pipefail
          cd $STACK_DIR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cat > .env <<ENV
          IMAGE=${{ env.IMAGE }}:${TAG}
          APP_PORT=${APP_PORT}
          AUTH_SECRET=${{ secrets.STAGING_AUTH_SECRET }}
          BASE_URL=http://${VPS_B_HOST}:${APP_PORT}
          ENV
          docker compose -p staging pull
          docker compose -p staging up -d --remove-orphans
          docker image prune -f >/dev/null
          EOF

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint
        env:
          VPS_B_HOST: ${{ secrets.VPS_B_HOST }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://$VPS_B_HOST:${APP_PORT}/api/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "health check failed"; exit 1
